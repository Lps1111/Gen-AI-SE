<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis - Voice Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #888;
            margin-bottom: 40px;
            font-size: 0.95rem;
        }

        /* Orb animation */
        .orb-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 40px;
        }

        .orb {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #1e3a5f, #0a0a2e);
            border: 2px solid #1e3a5f;
            transition: all 0.3s ease;
            position: relative;
        }

        .orb.connected {
            border-color: #3b82f6;
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.3);
        }

        .orb.speaking {
            border-color: #8b5cf6;
            box-shadow: 0 0 60px rgba(139, 92, 246, 0.4);
            animation: pulse 1.5s ease-in-out infinite;
        }

        .orb.listening {
            border-color: #22c55e;
            box-shadow: 0 0 60px rgba(34, 197, 94, 0.4);
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .orb-label {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            color: #888;
            white-space: nowrap;
        }

        .orb.connected .orb-label { color: #3b82f6; }
        .orb.speaking .orb-label { color: #8b5cf6; }
        .orb.listening .orb-label { color: #22c55e; }

        /* Connect button */
        #connectBtn {
            padding: 14px 48px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        #connectBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }

        #connectBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        #connectBtn.disconnect {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        /* Chat log */
        .chat-log {
            margin-top: 30px;
            text-align: left;
            max-height: 250px;
            overflow-y: auto;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .chat-msg {
            padding: 8px 0;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-msg:last-child { border-bottom: none; }

        .chat-msg .label {
            font-weight: 600;
            margin-right: 8px;
        }

        .chat-msg .label.you { color: #22c55e; }
        .chat-msg .label.jarvis { color: #8b5cf6; }
        .chat-msg .label.system { color: #f59e0b; }

        .status-bar {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #555;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Jarvis</h1>
    <p class="subtitle">Your Personal Voice Assistant</p>

    <div class="orb-container">
        <div class="orb" id="orb">
            <span class="orb-label" id="orbLabel">Click Connect to start</span>
        </div>
    </div>

    <button id="connectBtn" onclick="toggleConnection()">Connect</button>

    <div class="chat-log" id="chatLog"></div>

    <div class="status-bar" id="statusBar">Not connected</div>
</div>

<!-- LiveKit Client SDK -->
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.js"></script>

<script>
    const orb = document.getElementById('orb');
    const orbLabel = document.getElementById('orbLabel');
    const connectBtn = document.getElementById('connectBtn');
    const chatLog = document.getElementById('chatLog');
    const statusBar = document.getElementById('statusBar');

    let room = null;
    let isConnected = false;

    function addChat(label, text, type) {
        const msg = document.createElement('div');
        msg.className = 'chat-msg';
        msg.innerHTML = `<span class="label ${type}">${label}:</span>${text}`;
        chatLog.appendChild(msg);
        chatLog.scrollTop = chatLog.scrollHeight;
    }

    function setStatus(text) {
        statusBar.textContent = text;
    }

    function setOrb(state, label) {
        orb.className = 'orb ' + state;
        orbLabel.textContent = label;
    }

    async function toggleConnection() {
        if (isConnected) {
            await disconnect();
        } else {
            await connect();
        }
    }

    async function connect() {
        try {
            connectBtn.disabled = true;
            connectBtn.textContent = 'Connecting...';
            setStatus('Fetching token...');

            // 1. Get token from our token server
            const resp = await fetch('/token');
            const data = await resp.json();

            if (data.error) {
                throw new Error(data.error);
            }

            setStatus('Connecting to LiveKit...');

            // 2. Create room and connect
            room = new LivekitClient.Room({
                audioCaptureDefaults: {
                    autoGainControl: true,
                    echoCancellation: true,
                    noiseSuppression: true,
                },
            });

            // --- Event Handlers ---

            // When agent starts/stops speaking (track activity)
            room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                if (track.kind === 'audio') {
                    // Attach audio so we can hear the agent
                    const element = track.attach();
                    document.body.appendChild(element);
                    addChat('System', 'Agent connected! Start talking.', 'system');
                    setOrb('connected', 'Ready - speak now');
                }
            });

            room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
                track.detach().forEach(el => el.remove());
            });

            // Listen for transcription events (agent's text responses)
            room.on(LivekitClient.RoomEvent.TranscriptionReceived, (segments, participant) => {
                for (const segment of segments) {
                    if (segment.final) {
                        if (participant?.identity === 'web-user') {
                            addChat('You', segment.text, 'you');
                        } else {
                            addChat('Jarvis', segment.text, 'jarvis');
                        }
                    }
                }
            });

            // Active speaker detection
            room.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, (speakers) => {
                const agentSpeaking = speakers.some(s => s.identity !== 'web-user');
                const userSpeaking = speakers.some(s => s.identity === 'web-user');

                if (agentSpeaking) {
                    setOrb('speaking', 'Jarvis is speaking...');
                } else if (userSpeaking) {
                    setOrb('listening', 'Listening to you...');
                } else if (isConnected) {
                    setOrb('connected', 'Ready - speak now');
                }
            });

            room.on(LivekitClient.RoomEvent.Disconnected, () => {
                handleDisconnect();
            });

            // 3. Connect to room
            await room.connect(data.url, data.token);

            // 4. Publish microphone
            await room.localParticipant.setMicrophoneEnabled(true);

            isConnected = true;
            connectBtn.textContent = 'Disconnect';
            connectBtn.className = 'disconnect';
            connectBtn.disabled = false;
            setOrb('connected', 'Connected - waiting for agent...');
            setStatus('Connected! Waiting for agent to join...');
            addChat('System', 'Connected to room. Waiting for agent...', 'system');

        } catch (err) {
            console.error('Connection error:', err);
            setStatus('Error: ' + err.message);
            addChat('System', 'Error: ' + err.message, 'system');
            connectBtn.textContent = 'Connect';
            connectBtn.disabled = false;
            setOrb('', 'Connection failed');
        }
    }

    async function disconnect() {
        if (room) {
            await room.disconnect();
        }
        handleDisconnect();
    }

    function handleDisconnect() {
        isConnected = false;
        room = null;
        connectBtn.textContent = 'Connect';
        connectBtn.className = '';
        connectBtn.disabled = false;
        setOrb('', 'Click Connect to start');
        setStatus('Disconnected');
        addChat('System', 'Disconnected.', 'system');
    }
</script>

</body>
</html>
